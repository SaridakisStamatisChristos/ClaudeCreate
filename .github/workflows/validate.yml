name: Validate local reel code
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check bin/reel.mjs && node --check src/spec.mjs && node --check src/composition.mjs
      - run: python3 -m py_compile tools/*.py
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm run test:integration
      - run: npm install --no-audit --no-fund
      - run: npm run test:hyperframes
      - run: node tools/editorial_hyperframes_smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-v02-stills
          path: .reel-work/editorial-smoke/frames/*.png
          if-no-files-found: ignore
          retention-days: 7
